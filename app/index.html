<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đập chuột</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../design/tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hình chuột dùng chung (SVG tự vẽ) -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <clipPath id="pit"><rect x="0" y="0" width="100" height="84"/></clipPath>
      <symbol id="mole-shape" viewBox="0 0 100 100">
        <circle class="m-ear" cx="27" cy="30" r="9"/>
        <circle class="m-ear" cx="73" cy="30" r="9"/>
        <path class="m-body" d="M18 100 V52 a32 32 0 0 1 64 0 V100 Z"/>
        <ellipse class="m-muzzle" cx="50" cy="64" rx="17" ry="13"/>
        <circle class="m-eye" cx="39" cy="46" r="4.5"/>
        <circle class="m-eye" cx="61" cy="46" r="4.5"/>
        <ellipse class="m-eye" cx="50" cy="57" rx="5.5" ry="4"/>
      </symbol>
    </defs>
  </svg>

  <div class="app" id="app">

    <!-- 3.1 Màn hình Bắt đầu -->
    <section class="screen screen-start" id="screen-start" aria-labelledby="start-title">
      <svg class="hero-mole" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse class="hole" cx="50" cy="80" rx="38" ry="12"/>
        <g clip-path="url(#pit)"><use href="#mole-shape"/></g>
        <ellipse class="rim" cx="50" cy="89" rx="44" ry="7"/>
      </svg>
      <h1 class="title" id="start-title">Đập chuột</h1>
      <p class="rules">Đập trúng chuột để được +1 điểm.<br>Bạn có 30 giây.</p>
      <button class="btn btn-accent btn-lg" id="btn-start" type="button">Bắt đầu</button>
      <p class="record-line" id="start-record" hidden>Kỷ lục: <strong id="start-record-value">0</strong></p>
      <p class="hint">Phím <kbd>1</kbd>–<kbd>9</kbd> để đập · <kbd>Enter</kbd> để bắt đầu</p>
    </section>

    <!-- 3.2 Màn hình Chơi -->
    <section class="screen screen-play" id="screen-play" aria-label="Màn hình chơi" hidden>
      <div class="status" role="group" aria-label="Trạng thái lượt chơi">
        <div class="stat stat-time" id="stat-time"><span class="stat-label">Thời gian</span><span class="stat-value" id="time-value">30</span></div>
        <div class="stat"><span class="stat-label">Điểm</span><span class="stat-value" id="score-value">0</span></div>
        <div class="stat stat-record"><span class="stat-label">Kỷ lục</span><span class="stat-value" id="play-record-value">0</span></div>
      </div>

      <div class="board" id="board" tabindex="-1" aria-label="Lưới 3 nhân 3">
        <div class="grid" id="grid"></div>
        <div class="countdown" id="countdown" aria-hidden="true">3</div>
      </div>
    </section>

    <!-- 3.3 Màn hình Kết thúc -->
    <section class="screen screen-end" id="screen-end" aria-labelledby="end-title" hidden>
      <h2 class="title" id="end-title">Hết giờ!</h2>
      <p class="end-label">Điểm của bạn</p>
      <p class="end-score" id="end-score">0</p>
      <p class="badge-record" id="end-new-record" hidden>Kỷ lục mới!</p>
      <p class="record-line">Kỷ lục: <strong id="end-record-value">0</strong></p>
      <button class="btn btn-accent btn-lg" id="btn-replay" type="button">Chơi lại</button>
    </section>

    <!-- Thông báo cho trình đọc màn hình -->
    <div class="sr-only" id="live" aria-live="polite"></div>
  </div>

  <template id="cell-template">
    <button class="cell" type="button">
      <span class="cell-key" aria-hidden="true"></span>
      <svg class="cell-art" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <ellipse class="hole" cx="50" cy="80" rx="38" ry="12"/>
        <g clip-path="url(#pit)"><g class="mole"><use href="#mole-shape"/></g></g>
        <ellipse class="rim" cx="50" cy="89" rx="44" ry="7"/>
      </svg>
    </button>
  </template>

  <script src="game.js"></script>
</body>
</html>
